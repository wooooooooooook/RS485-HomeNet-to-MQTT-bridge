name: Temporary PR 723 fix

on:
  push:
    branches:
      - feat/xor-final-checksum

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xor-final-checksum
          fetch-depth: 0
      - name: Patch packet parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/protocol/packet-parser.ts')
          s = p.read_text()
          old = "if (!useSparseScan && this.isStandard1Byte && !isBestinSum) {"
          new = "if (!useSparseScan && this.isStandard1Byte && !isBestinSum && !typeStr.startsWith('xor_final(') && !typeStr.startsWith('xor_final_no_header(')) {"
          if old not in s:
              raise SystemExit('target condition not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit parser fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/protocol/packet-parser.ts
          git rm .github/workflows/_fix-pr723.yml
          git commit -m 'fix(protocol): bypass sliding window for xor-final checksums'
          git push origin HEAD:feat/xor-final-checksum
