meta:
  name: "삼성 에어컨 실외기 센서 (NASA)"
  name_en: "Samsung HVAC Outdoor Sensors (NASA)"
  description: |
    삼성 에어컨 NASA 프로토콜 실외기 센서 설정입니다.
    외기 온도, 인버터 소비전력 및 에러코드를 모니터링합니다.

    Message Numbers:
    - 0x8201: 외기 온도 (VAR: value / 10.0 °C)
    - 0x8204: 인버터 전력 (VAR: W)
    - 0x8003: 에러 코드 (ENUM)
  description_en: |
    Samsung HVAC NASA protocol outdoor unit sensors.
    Monitors outdoor temperature, inverter power, and error codes.
  version: "1.0.0"
  author: "wooooooooooook"
  tags: ["sensor", "hvac", "outdoor", "samsung", "nasa"]

entities:
  sensor:
    - id: 'outdoor_temperature'
      name: 'Outdoor Temperature'
      device_class: 'temperature'
      state_class: 'measurement'
      unit_of_measurement: '°C'
      # SA: 0x10, 0x00, 0x00 (Outdoor unit 10.00.00)
      state:
        data: [0x10, 0x00, 0x00]
        index: 3
      state_value: >-
        (int(data[13]) == 0x82 && int(data[14]) == 0x01) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null

    - id: 'outdoor_inverter_power'
      name: 'Outdoor Inverter Power'
      device_class: 'power'
      state_class: 'measurement'
      unit_of_measurement: 'W'
      state:
        data: [0x10, 0x00, 0x00]
        index: 3
      state_value: >-
        (int(data[13]) == 0x82 && int(data[14]) == 0x04) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16]))) : null

    - id: 'outdoor_error_code'
      name: 'Outdoor Error Code'
      state:
        data: [0x10, 0x00, 0x00]
        index: 3
      state_value: >-
        (int(data[13]) == 0x80 && int(data[14]) == 0x03) ? dyn(int(data[15])) : null
