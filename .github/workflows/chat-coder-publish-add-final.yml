name: Chat Coder publish add_final

on:
  push:
    branches:
      - feat/add-final-checksum
    paths:
      - .github/workflows/chat-coder-publish-add-final.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply artifact-derived source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/add-final.patch <<'PATCH'
