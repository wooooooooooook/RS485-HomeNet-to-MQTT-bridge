name: Package workspace for ChatGPT

# Transport helper for sandboxed ChatGPT/Codex sessions.
# It is intentionally triggered only when this workflow file is added/changed on
# a branch, so installing it does not cause every subsequent repository push to
# package the workspace again. Run it manually with workflow_dispatch when needed.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/package-chat-workspace.yml

permissions:
  contents: read

env:
  CHUNK_SIZE: 450m
  ARTIFACT_NAME: chat-workspace

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace-artifacts
          archive="workspace-artifacts/${GITHUB_REPOSITORY#*/}-source.tar.gz"
          tar --exclude=.git --exclude=.github/workflows/package-chat-workspace.yml \
            -czf "$archive" .

      - name: Detect pnpm project
        id: pnpm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.pnpm.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false

      - name: Setup Node.js
        if: steps.pnpm.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Populate pnpm store
        if: steps.pnpm.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Package pnpm store
        if: steps.pnpm.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          store_path="$(pnpm store path)"
          tar -czf workspace-artifacts/pnpm-store.tar.gz -C "$store_path" .

      - name: Split artifacts into transport-sized chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace-artifacts/chunks
          shopt -s nullglob
          archives=(workspace-artifacts/*.tar.gz)
          if ((${#archives[@]} == 0)); then
            echo "No workspace archives were created" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            name="$(basename "$archive")"
            split -b "$CHUNK_SIZE" -d -a 3 "$archive" "workspace-artifacts/chunks/${name}.part-"
          done
          rm workspace-artifacts/*.tar.gz
          sha256sum workspace-artifacts/chunks/* > workspace-artifacts/SHA256SUMS
          find workspace-artifacts -type f -printf '%p %s bytes\n' | sort > workspace-artifacts/MANIFEST.txt

      - name: Upload workspace source and dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: workspace-artifacts/
          retention-days: 7
          compression-level: 0
