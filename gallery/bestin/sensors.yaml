meta:
  name: "Bestin General/Gen2 에너지 센서"
  name_en: "Bestin General/Gen2 Energy Sensors"
  description: >-
    Bestin General/Gen2 게이트웨이용 에너지 센서 설정입니다. 
    전기, 수도, 온수, 가스, 난방 5개 요소의 총 사용량과 실시간 사용량을 제공합니다.
  description_en: >- 
    Bestin General/Gen2 gateway energy sensors configuration.
    Provides total and realtime usage for 5 elements: electric, water, hotwater, gas, heat.
  version: "2.0.0"
  author: "wooooooooooook"
  tags: ["energy", "sensor", "bestin"]

discovery:
  match:
    data: [0x02, 0xD1]
    mask: [0xFF, 0xFF]

entities:
  sensor:
    - id: "energy_electric_total"
      name: "전기 총 사용량"
      device_class: energy
      unit_of_measurement: kWh
      state_class: total_increasing
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 8
        length: 4
        decode: bcd
        precision: 2
    - id: "energy_electric_realtime"
      name: "전기 실시간 사용량"
      device_class: power
      unit_of_measurement: W
      state_class: measurement
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 13
        length: 2
        decode: bcd
    - id: "energy_water_total"
      name: "수도 총 사용량"
      device_class: water
      unit_of_measurement: "m³"
      state_class: total_increasing
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 17
        length: 3
        decode: bcd
        precision: 3
    - id: "energy_water_realtime"
      name: "수도 실시간 사용량"
      unit_of_measurement: "m³/h"
      state_class: measurement
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 21
        length: 2
        decode: bcd
    - id: "energy_hotwater_total"
      name: "온수 총 사용량"
      device_class: water
      unit_of_measurement: "m³"
      state_class: total_increasing
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 24
        length: 4
        decode: bcd
        precision: 3
    - id: "energy_hotwater_realtime"
      name: "온수 실시간 사용량"
      unit_of_measurement: "m³/h"
      state_class: measurement
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 29
        length: 2
        decode: bcd
    - id: "energy_gas_total"
      name: "가스 총 사용량"
      device_class: gas
      unit_of_measurement: "m³"
      state_class: total_increasing
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 32
        length: 4
        decode: bcd
        precision: 3
    - id: "energy_gas_realtime"
      name: "가스 실시간 사용량"
      unit_of_measurement: "m³/h"
      state_class: measurement
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 37
        length: 2
        decode: bcd
        precision: 1
    - id: "energy_heat_total"
      name: "난방 총 사용량"
      unit_of_measurement: "m³"
      state_class: total_increasing
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 40
        length: 4
        decode: bcd
        precision: 3
    - id: "energy_heat_realtime"
      name: "난방 실시간 사용량"
      unit_of_measurement: "m³/h"
      state_class: measurement
      state:
        data: [0x02, 0xD1]
      state_number:
        index: 45
        length: 2
        decode: bcd
