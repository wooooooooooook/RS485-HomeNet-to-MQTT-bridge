meta:
  name: "삼성 에어컨 (NASA)"
  name_en: "Samsung HVAC (NASA)"
  description: |
    삼성 에어컨 NASA 프로토콜 설정입니다.
    신형 에어컨 (무풍, 360 카세트 등) RS485 버스를 제어합니다.

    패킷 구조 (가변 길이):
    [0x32] [LEN_HI] [LEN_LO] [SA_3B] [DA_3B] [CMD_3B] [MSG_COUNT] [MSG_DATA...] [CRC_2B] [0x34]

    Message Numbers:
    - 0x4000: Power Enum (0=Off, 1=On)
    - 0x4001: Mode Enum (0=Auto, 1=Cool, 2=Dry, 3=Fan, 4=Heat)
    - 0x4006: Fan Mode Enum (0=Auto, 1=Low, 2=Mid, 3=High, 4=Turbo)
    - 0x4201: Target Temp Variable (value * 10, e.g. 240 = 24.0°C)
    - 0x4203: Current Room Temp Variable (value * 10, e.g. 220 = 22.0°C)
  description_en: |
    Samsung HVAC NASA protocol configuration for modern AC models (WindFree, 360 Cassette).
  version: "1.0.0"
  author: "wooooooooooook"
  tags: ["climate", "hvac", "aircon", "samsung", "nasa"]

parameters:
  - name: unit_count
    type: integer
    default: 2
    min: 1
    max: 16
    label: "실내기 수"
    label_en: "Number of Indoor Units"

entities:
  climate:
    - $repeat:
        count: '{{unit_count}}'
        as: i
        start: 1
      id: 'hvac_{{i}}'
      name: 'HVAC {{i}}'
      visual:
        min_temperature: 16
        max_temperature: 30
        temperature_step: 1
      modes: ["off", "auto", "cool", "heat", "dry", "fan_only"]
      fan_modes: ["auto", "low", "medium", "high"]

      # SA (Source): 0x20, 0x00, i (Indoor unit i address: 20.00.01, 20.00.02, ...)
      state:
        data: [0x20, 0x00, '{{i}}']
        index: 3

      # 0x4201: Target Temperature (Variable: 2 bytes value at data[15..16])
      state_temperature_target: >-
        (int(data[13]) == 0x42 && int(data[14]) == 0x01) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null

      # 0x4203: Current Room Temperature (Variable: 2 bytes value at data[15..16])
      state_temperature_current: >-
        (int(data[13]) == 0x42 && int(data[14]) == 0x03) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null

      # 0x4000: Power Enum (0=Off, 1=On)
      state_off:
        index: 13
        data: [0x40, 0x00, 0x00]
      state_on:
        index: 13
        data: [0x40, 0x00, 0x01]

      # 0x4001: Mode Enum (0=Auto, 1=Cool, 2=Dry, 3=Fan, 4=Heat)
      state_auto:
        index: 13
        data: [0x40, 0x01, 0x00]
      state_cool:
        index: 13
        data: [0x40, 0x01, 0x01]
      state_dry:
        index: 13
        data: [0x40, 0x01, 0x02]
      state_fan_only:
        index: 13
        data: [0x40, 0x01, 0x03]
      state_heat:
        index: 13
        data: [0x40, 0x01, 0x04]

      # 0x4006: Fan Speed Enum (0=Auto, 1=Low, 2=Mid, 3=High)
      state_fan_auto:
        index: 13
        data: [0x40, 0x06, 0x00]
      state_fan_low:
        index: 13
        data: [0x40, 0x06, 0x01]
      state_fan_medium:
        index: 13
        data: [0x40, 0x06, 0x02]
      state_fan_high:
        index: 13
        data: [0x40, 0x06, 0x03]

      # Outbound Control Packets (Payload size=17 -> len field 0x00, 0x11 or 0x00, 0x12):
      # [0x00, 0x11] = Size 17, [0x80, 0xFF, 0x00] = SA, [0x20, 0x00, i] = DA, [0xC0, 0x12, 0x01] = CMD, 0x01 = COUNT
      command_off:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x00, 0x00]
      command_heat:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x04]
      command_cool:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x01]
      command_dry:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x02]
      command_fan_only:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x03]
      command_auto:
        data: [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, '{{i}}', 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x00]

      # Target temperature write (0x4201): len=0x00, 0x12 (18)
      command_temperature: >-
        [[0x00, 0x12, 0x80, 0xFF, 0x00, 0x20, 0x00, {{i}}, 0xC0, 0x12, 0x01, 0x01, 0x42, 0x01, bitShiftRight(int(double(x) * 10.0), 8), bitAnd(int(double(x) * 10.0), 255)]]

      command_fan_mode: >-
        xstr == 'low' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, {{i}}, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x01]]
        : xstr == 'medium' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, {{i}}, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x02]]
        : xstr == 'high' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, {{i}}, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x03]]
        : [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, {{i}}, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x00]]
