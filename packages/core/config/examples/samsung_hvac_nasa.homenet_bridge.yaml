homenet_bridge:
  serial:
    portId: samsung_hvac_nasa
    path: /dev/ttyUSB0
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1

  packet_defaults:
    rx_timeout: 10ms
    tx_delay: 10ms
    tx_timeout: 200ms
    tx_retry_cnt: 3
    rx_checksum2: 'crc16_no_header(data, 3, 0x1021, 0, false, false, 0)'
    tx_checksum2: 'crc16_no_header(data, 3, 0x1021, 0, false, false, 0)'
    rx_header: [0x32]
    tx_header: [0x32]
    rx_footer: [0x34]
    tx_footer: [0x34]
    rx_length_expr: '(int(data[1]) << 8) + int(data[2]) + 2'
    rx_min_length: 14
    rx_max_length: 100

  climate:
    - id: 'hvac_1'
      name: 'HVAC 1'
      visual:
        min_temperature: 16
        max_temperature: 30
        temperature_step: 1
      modes: ['off', 'auto', 'cool', 'heat', 'dry', 'fan_only']
      fan_modes: ['auto', 'low', 'medium', 'high']
      state:
        data: [0x20, 0x00, 0x01]
        index: 3

      state_temperature_target: >-
        (int(data[13]) == 0x42 && int(data[14]) == 0x01) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null
      state_temperature_current: >-
        (int(data[13]) == 0x42 && int(data[14]) == 0x03) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null

      state_off:
        index: 13
        data: [0x40, 0x00, 0x00]
      state_on:
        index: 13
        data: [0x40, 0x00, 0x01]

      state_auto:
        index: 13
        data: [0x40, 0x01, 0x00]
      state_cool:
        index: 13
        data: [0x40, 0x01, 0x01]
      state_dry:
        index: 13
        data: [0x40, 0x01, 0x02]
      state_fan_only:
        index: 13
        data: [0x40, 0x01, 0x03]
      state_heat:
        index: 13
        data: [0x40, 0x01, 0x04]

      state_fan_auto:
        index: 13
        data: [0x40, 0x06, 0x00]
      state_fan_low:
        index: 13
        data: [0x40, 0x06, 0x01]
      state_fan_medium:
        index: 13
        data: [0x40, 0x06, 0x02]
      state_fan_high:
        index: 13
        data: [0x40, 0x06, 0x03]

      command_off:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x00, 0x00]
      command_heat:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x04]
      command_cool:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x01]
      command_dry:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x02]
      command_fan_only:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x03]
      command_auto:
        data:
          [0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x01, 0x00]

      command_temperature: >-
        [[0x00, 0x12, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x42, 0x01, bitShiftRight(int(double(x) * 10.0), 8), bitAnd(int(double(x) * 10.0), 255)]]

      command_fan_mode: >-
        x == 'low' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x01]]
        : x == 'medium' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x02]]
        : x == 'high' ? [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x03]]
        : [[0x00, 0x11, 0x80, 0xFF, 0x00, 0x20, 0x00, 0x01, 0xC0, 0x12, 0x01, 0x01, 0x40, 0x06, 0x00]]

  sensor:
    - id: 'outdoor_temperature'
      name: 'Outdoor Temperature'
      device_class: 'temperature'
      state_class: 'measurement'
      unit_of_measurement: '°C'
      state:
        data: [0x10, 0x00, 0x00]
        index: 3
      state_value: >-
        (int(data[13]) == 0x82 && int(data[14]) == 0x01) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16])) / 10.0) : null

    - id: 'outdoor_inverter_power'
      name: 'Outdoor Inverter Power'
      device_class: 'power'
      state_class: 'measurement'
      unit_of_measurement: 'W'
      state:
        data: [0x10, 0x00, 0x00]
        index: 3
      state_value: >-
        (int(data[13]) == 0x82 && int(data[14]) == 0x04) ? dyn(double(bitShiftLeft(int(data[15]), 8) + int(data[16]))) : null
