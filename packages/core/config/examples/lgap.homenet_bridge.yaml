homenet_bridge:
  serial:
    portId: lgap
    path: /dev/ttyUSB0
    baud_rate: 4800
    data_bits: 8
    parity: NONE
    stop_bits: 1

  packet_defaults:
    rx_timeout: 10ms
    tx_delay: 10ms
    tx_timeout: 200ms
    tx_retry_cnt: 3
    rx_checksum: xor_final(0x55)
    tx_checksum: xor_final(0x55)
    rx_header: [0x10]
    tx_header: [0x80]
    rx_length: 16

  # LGAP ODU does not continuously publish indoor-unit state.
  # Poll each configured zone with the status-request frame documented
  # by jourdant/esphome-lgap. RX responses are matched by zone in climate.
  automation:
    - id: lgap_poll_zone_0
      name: 'LGAP Zone 0 상태 polling'
      trigger:
        - type: startup
        - type: schedule
          every: '5s'
      then:
        - action: send_packet
          data: [0x00, 0xA0, 0x00]
          header: true
          footer: false
          checksum: true

  climate:
    - id: 'lgap_zone_0'
      name: 'LG 에어컨 1'
      visual:
        min_temperature: 16
        max_temperature: 30
        temperature_step: 1
      modes: ['off', 'auto', 'cool', 'heat', 'dry', 'fan_only']
      fan_modes: ['auto', 'low', 'medium', 'high']

      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0

      state_temperature_target: >-
        double(bitAnd(data[7], 15)) + 15.0
      state_temperature_current: >-
        (192.0 - double(data[8])) / 3.0

      state_off:
        index: 1
        data: [0x00]
        mask: [0x01]
      state_heat:
        index: 6
        data: [0x04]
        mask: [0x07]
      state_cool:
        index: 6
        data: [0x00]
        mask: [0x07]
      state_dry:
        index: 6
        data: [0x01]
        mask: [0x07]
      state_fan_only:
        index: 6
        data: [0x02]
        mask: [0x07]
      state_auto:
        index: 6
        data: [0x03]
        mask: [0x07]

      state_fan_auto:
        index: 6
        data: [0x40]
        mask: [0x70]
      state_fan_low:
        index: 6
        data: [0x10]
        mask: [0x70]
      state_fan_medium:
        index: 6
        data: [0x20]
        mask: [0x70]
      state_fan_high:
        index: 6
        data: [0x30]
        mask: [0x70]

      command_off:
        data: [0x00, 0xA0, 0x00, 0x02, 0x00, 0x07]
      command_heat: >-
        [[0x00, 0xA0, 0x00, 0x03, 0x44,
          int(get_from_state('temperature_target', 22)) - 15]]
      command_cool: >-
        [[0x00, 0xA0, 0x00, 0x03, 0x40,
          int(get_from_state('temperature_target', 22)) - 15]]
      command_dry: >-
        [[0x00, 0xA0, 0x00, 0x03, 0x41,
          int(get_from_state('temperature_target', 22)) - 15]]
      command_fan_only: >-
        [[0x00, 0xA0, 0x00, 0x03, 0x42,
          int(get_from_state('temperature_target', 22)) - 15]]
      command_auto: >-
        [[0x00, 0xA0, 0x00, 0x03, 0x43,
          int(get_from_state('temperature_target', 22)) - 15]]

      command_temperature: >-
        [[0x00, 0xA0, 0x00, 0x03,
          bitOr(
            get_from_state('mode', 'cool') == 'heat' ? 0x04 :
            get_from_state('mode', 'cool') == 'dry' ? 0x01 :
            get_from_state('mode', 'cool') == 'fan_only' ? 0x02 :
            get_from_state('mode', 'cool') == 'auto' ? 0x03 : 0x00,
            get_from_state('fan_mode', 'auto') == 'low' ? 0x10 :
            get_from_state('fan_mode', 'auto') == 'medium' ? 0x20 :
            get_from_state('fan_mode', 'auto') == 'high' ? 0x30 : 0x40),
          int(x) - 15]]

      command_fan_mode: >-
        x == 'low' ? [[0x00, 0xA0, 0x00, 0x03, 0x10, int(get_from_state('temperature_target', 22)) - 15]] :
        x == 'medium' ? [[0x00, 0xA0, 0x00, 0x03, 0x20, int(get_from_state('temperature_target', 22)) - 15]] :
        x == 'high' ? [[0x00, 0xA0, 0x00, 0x03, 0x30, int(get_from_state('temperature_target', 22)) - 15]] :
        [[0x00, 0xA0, 0x00, 0x03, 0x40, int(get_from_state('temperature_target', 22)) - 15]]

  sensor:
    - id: 'lgap_error_0'
      name: 'LG 에러 코드 1'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: 'data[5]'

    - id: 'lgap_pipe_in_0'
      name: 'LG 배관 입구 온도 1'
      unit_of_measurement: '°C'
      device_class: 'temperature'
      state_class: 'measurement'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: '(192.0 - double(data[9])) / 3.0'

    - id: 'lgap_pipe_out_0'
      name: 'LG 배관 출구 온도 1'
      unit_of_measurement: '°C'
      device_class: 'temperature'
      state_class: 'measurement'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: '(192.0 - double(data[10])) / 3.0'

    - id: 'lgap_active_load_0'
      name: 'LG Zone Active Load 1'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: 'data[11]'

    - id: 'lgap_power_state_0'
      name: 'LG Zone Power State 1'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: 'data[12]'

    - id: 'lgap_design_load_0'
      name: 'LG Zone Design Load 1'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: 'data[13]'

    - id: 'lgap_odu_load_0'
      name: 'LG ODU Total Load 1'
      state:
        data: [0x10, 0x00, 0xA0, 0x00, 0x00]
        mask: [0xFF, 0x00, 0xFF, 0x00, 0xFF]
        index: 0
      state_value: 'data[14]'
